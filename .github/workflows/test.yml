# PR 테스트 — Ubuntu 시스템 gcc 로 make test 를 돌리고 JUnit XML 아티팩트를 남긴다.
# 판정은 make 의 종료 코드다(하나라도 실패하면 이 step 과 job 이 실패한다).
# action 은 GitHub 공식 것만, 커밋 SHA 로 고정한다(공개 저장소 공급망 위험).
name: test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: gcc 버전
        run: gcc --version

      # 테스트가 실패하면 이 step 과 job 이 실패한다(그대로 둔다)
      - name: C 테스트
        run: make test

      # XML 이 하나도 없으면 빌드가 깨진 것이다 — 빈 아티팩트로 통과시키지 않는다
      - name: JUnit XML 아티팩트
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: junit-xml
          path: test-results/*.xml
          if-no-files-found: error
